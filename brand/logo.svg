<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D2D2D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="230" r="180" fill="#1A1A1A" stroke="#C8A97E" stroke-width="3"/>

  <!-- Inner ring -->
  <circle cx="250" cy="230" r="165" fill="none" stroke="#C8A97E" stroke-width="1" opacity="0.4"/>

  <!-- V letter — bold, vintage style -->
  <path d="M170 160 L250 310 L330 160" stroke="#C8A97E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small V inside -->
  <path d="M210 200 L250 280 L290 200" stroke="#E8D5B7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Star accent -->
  <polygon points="250,130 255,145 270,145 258,155 262,170 250,160 238,170 242,155 230,145 245,145" fill="#C8A97E"/>

  <!-- Decorative lines -->
  <line x1="180" y1="340" x2="320" y2="340" stroke="#C8A97E" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="348" x2="300" y2="348" stroke="#C8A97E" stroke-width="1" opacity="0.3"/>

  <!-- Brand name -->
  <text x="250" y="380" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="30" fill="#C8A97E" letter-spacing="8">VNTGE</text>
  <text x="250" y="410" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="300" font-size="16" fill="#E8D5B7" letter-spacing="12">CULTURE</text>

  <!-- Year established -->
  <text x="250" y="440" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="10" fill="#8B7355" letter-spacing="4">EST. 2019</text>
</svg>
